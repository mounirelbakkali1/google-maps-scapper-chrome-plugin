<!DOCTYPE html>
<html>
<head>
  <title>Google Maps Easy Scrape</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { 
      min-width: 570px; 
      padding: 20px; 
      font-family: 'Poppins', sans-serif; 
    }
    #message {
      font-size: 16px;
      padding: 20px 0;
    }
    #message a {
      color: #00a37a;
      text-decoration: underline;
    }
    .button {
      padding: 10px 20px; 
      border: none;
      color: white;
      background-color: #00a37a;
      cursor: pointer; 
      transition: background-color 0.3s ease; 
      border-radius: 20px;
      font-family: 'Poppins', sans-serif;
    }
    .button:hover {
      background-color: #07e0aa; 
    }
    .input {
      padding: 8px 15px;
      margin-right: 10px; 
      border: 1px solid #ddd;
      border-radius: 20px;
      font-family: 'Poppins', sans-serif;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      max-width: 100%;
      overflow-x: auto;
      display: block;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      min-width: 120px;
    }
    th {
      padding-top: 12px;
      padding-bottom: 12px;
      text-align: left;
      background-color: #dddddd;
    }
    h1 {
      font-weight: 600;
      font-size: 24px;
      margin: 0;
    }
  </style>  
</head>
<body>
  <h1>&#x1F5FA;&#xFE0F; Google Maps Easy Scraper</h1>
  <div id="message">Checking URL...</div>
  <button id="actionButton" class="button" disabled>Scrape Data</button>
  <input type="text" id="filenameInput" class="input" placeholder="Enter filename (e.g. my_data)" />
  <button id="downloadCsvButton" class="button" disabled>Download CSV</button>
  
  <table id="resultsTable">
    <thead>
      <tr>
        <th>Title</th>
        <th>Rating</th>
        <th>Reviews</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Website</th>
        <th>Link</th>
        <th>Services</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="popup.js"></script>
</body>
</html>
